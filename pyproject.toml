[project]
name = "bracket-pong"
version = "0.1.0"
description = "BracketBot table-tennis simulation and reinforcement learning"
requires-python = ">=3.12,<3.14"
dependencies = [
  "mujoco>=3.3,<4",
  "numpy>=1.26,<3",
  "gymnasium>=1.0,<2",
  "stable-baselines3>=2.5,<3",
  "pytest>=8,<10",
  "pillow>=10",
  "glfw>=2.8,<3",
  "pyopengl>=3.1,<4",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "python-multipart>=0.0.20,<1",
  "httpx>=0.27,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
